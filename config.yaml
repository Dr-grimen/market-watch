# Innstillingar for market-watch.
# Endre her - ikkje i koden.

timezone: Europe/Oslo

# Kor sikker Claude må vere før du får melding (0.0 - 1.0).
# Høgare tal = færre meldingar, men sikrare. 0.75 er eit strengt utgangspunkt.
confidence_threshold: 0.75

# Minste tal minutt mellom to varsel om same aktivum og same retning.
# Hindrar at same nyheit gir deg fem SMS.
cooldown_minutes: 180

# Maks tal varsel per døgn, uansett. Sikring mot at rekninga eksploderer.
max_alerts_per_day: 6

# Maks tal nyheitssaker som blir sendt til Claude i éin køyring.
# Kvar sak kostar pengar, så dette er kostnadstaket ditt.
max_items_to_llm: 12

# --- Helseovervaking ---
# Stille er den normale utgangen frå dette verktøyet. Difor ser eit
# knekt verktøy nøyaktig ut som ein roleg marknad. Desse to
# innstillingane er den einaste måten du får vite forskjellen.

# Tal feil på rad før du får éi melding om at verktøyet er nede.
# 5 feil = ca. 100 minutt nede før du blir plaga.
failure_alert_after: 5

# Eit livsteikn i veka, så du veit at stille faktisk tyder stille.
# weekday: 0=måndag ... 4=fredag. hour er lokal tid.
heartbeat_enabled: true
heartbeat_weekday: 4
heartbeat_hour: 17

# Symbola er CNBC-kodar (hovudkjelda). yahoo_fallback er reservekodar
# som blir brukte berre dersom CNBC ikkje svarer.
assets:
  nasdaq:
    label: Nasdaq
    tickers:
      - ".IXIC"   # Nasdaq Composite
      - ".NDX"    # Nasdaq 100
      - "@ND.1"   # Nasdaq 100 futures - handlast også når børsen er stengd
    yahoo_fallback:
      ".IXIC": "^IXIC"
      ".NDX": "^NDX"
      "@ND.1": "NQ=F"
  oil:
    label: Olje
    tickers:
      - "@CL.1"   # WTI råolje
      - "@LCO.1"  # Brent råolje
    yahoo_fallback:
      "@CL.1": "CL=F"
      "@LCO.1": "BZ=F"

# --- Verdsbilete ---
# Desse er IKKJE varselmål. Du får aldri ei melding om at DAX fell.
# Dei er bakgrunn: Claude ser dei når han skal avgjere kva som skjer
# med Nasdaq og olje. Ein Nasdaq-open blir noko heilt anna dersom Asia
# fall 3 % i natt, og olje er noko heilt anna når dollaren styrkar seg.
#
# Alle symbol er testa mot CNBC 25.08.2026.
context_assets:
  asia_i_natt:
    label: Asia i natt
    tickers: [".N225", ".HSI", ".SSEC"]        # Nikkei, Hang Seng, Shanghai
  europa:
    label: Europa
    tickers: [".GDAXI", ".FTSE", ".STOXX50E"]  # DAX, FTSE 100, Euro STOXX 50
  usa_breidde:
    label: USA breidde
    tickers: [".SPX", ".DJI"]                  # S&P 500, Dow
  nasdaq_drivarar:
    label: Nasdaq-drivarar
    # Halvleiarar leier Nasdaq, og renta avgjer kva vekstaksjar er verdt.
    tickers: [".SOX", "NVDA", "US10Y"]
  olje_drivarar:
    label: Olje-drivarar
    # Energisektoren, gass, bensin-crack og dollaren. Olje fell ofte
    # rett og slett fordi dollaren stig, utan at noko har hendt.
    tickers: ["XLE", "@NG.1", "@RB.1", ".DXY"]
  risiko:
    label: Risikovilje
    tickers: [".VIX", "@GC.1"]                 # Frykt-indeksen og gull
  kroner:
    label: Kroner
    tickers: ["NOK=", "EURNOK="]               # USD/NOK, EUR/NOK

# Prisrørsle i prosent som i seg sjølv gjer ei sak interessant.
# Gjeld berre Nasdaq og olje - ikkje bakgrunnsbiletet.
price_move_threshold_pct: 0.8

# Maks alder på ei sak før ho blir ignorert.
max_news_age_hours: 12

