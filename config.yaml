    - interest rate
    - rate cut
    - rate hike
    - inflation
    - cpi
    - ppi
    - jobs report
    - nonfarm
    - unemployment
    - earnings
    - guidance
    - nvidia
    - apple
    - microsoft
    - amazon
    - alphabet
    - meta
    - tesla
    - broadcom
    - semiconductor
    - chip
    - tariff
    - recession
    - futures
  geopolitikk:
    # Hendingar som treffer Nasdaq gjennom risikovilje og oljepris.
    # Ein bombing i Libanon er ikkje ei Nasdaq-nyheit i seg sjølv - men
    # ho blir det dersom ho truar forsyning eller utløyser flukt frå risiko.
    - strike
    - airstrike
    - missile
    - drone attack
    - explosion
    - bombing
    - invasion
    - ceasefire
    - escalation
    - retaliation
    - nuclear
    - hezbollah
    - houthi
    - hamas
    - idf
    - tehran
    - taiwan
    - blockade
    - shipping attack
    - tanker
    - war
  oil:
    - oil
    - crude
    - brent
    - wti
    - opec
    - opec+
    - barrel
    - refinery
    - pipeline
    - inventories
    - eia report
    - saudi
    - aramco
    - russia
    - iran
    - strait of hormuz
    - sanctions
    - production cut
    - output
    - drilling
    - rig count
    - lng

