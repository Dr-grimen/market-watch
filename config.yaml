# Innstillingar for market-watch.
# Endre her - ikkje i koden.

timezone: Europe/Oslo

# Kor sikker Claude må vere før du får melding (0.0 - 1.0).
# 0.58, og det talet ser lågt ut med vilje. Historia bak er verdt å hugse.
#
# Vi hadde 0.66 fyrst. Så testa vi modellen på 64 historiske dagar der eit
# stort tal bomma på konsensus, og fann dette:
#
#   sa 50-60 %  ->  traff 50 %
#   sa 60-66 %  ->  traff 62 %   (godt kalibrert)
#   sa 66-75 %  ->  traff 44 %   (påstod 70 %)
#
# Over 66 % var han DÅRLEGARE enn under. Grunnen var ein instruks vi
# sjølve hadde skrive: "eit tal som avvik frå konsensus gir høg
# confidence". Den er målt feil - at eit tal bomma er eit faktum, men
# korleis marknaden reagerer er det ikkje.
#
# Då den instruksen blei fjerna og målinga lagt inn i staden, slutta han
# å gå over 66 % i det heile - og treffsikkerheita i 50-60-bøtta gjekk
# frå 50 % til 71 %. Sjølvtilliten hadde øydelagt signalet.
#
# Difor 0.58: det er der han faktisk treffer. Eit ærleg 58 slår eit
# oppblåse 70. (n=14, z=+1,6 - lovande, ikkje bevist.)
confidence_threshold: 0.58

# Minste tal minutt mellom to varsel om same aktivum og same retning.
# Hindrar at same nyheit gir deg fem SMS.
cooldown_minutes: 180

# Maks tal varsel per døgn, uansett. Sikring mot at rekninga eksploderer.
max_alerts_per_day: 6

# --- Kor raskt du får vite noko ---
# Verktøyet sjekkar kvart 3. minutt. Alt utanom sjølve Claude-kallet er
# gratis - prisar, intradag og 99 nyheitskjelder tek 20 sekund og kostar
# ingenting. Difor kan vi sjekke ofte, og berre BRUKE PENGAR når noko
# faktisk har endra seg sidan sist.
#
# Tre ting utløyser ei vurdering. Tala er sette for å halde kostnaden
# på rundt 5 kr i månaden - altså ~3 Claude-kall om dagen i staden for 60.
#
# Sjekkinga skjer framleis kvart 3. minutt, og alt det gratis blir gjort
# kvar gong: prisar, kalender, intradag, 103 kjelder, chart. Det er berre
# SJØLVE VURDERINGA som er sjeldan. Difor får du framleis faktameldingar
# med ein gong - "Core PCE kom inn på 0,1 %" krev ingen modell.
eval_move_trigger_pct: 0.8     # prisen må ha flytta ein heil dagsrørsle
eval_score_trigger: 40         # og saka må vere tung: fleire kjelder + hovudord
eval_max_gap_minutes: 300      # elles held det med éin gong kvar 5. time

# Maks tal nyheitssaker som blir sendt til Claude i éin køyring.
# Kvar sak kostar pengar, så dette er kostnadstaket ditt.
max_items_to_llm: 12
# Kor mange av dei 12 som er reserverte til saker som nemner Nasdaq.
# Utan denne tok geopolitikk 10 av 12 plassar da verdsovervakinga kom
# inn, og Fed-uttalar og resultatvarsel forsvann ut - dei sakene som
# faktisk flyttar Nasdaq oftast.
nasdaq_slots: 6

# --- Helseovervaking ---
# Stille er den normale utgangen frå dette verktøyet. Difor ser eit
# knekt verktøy nøyaktig ut som ein roleg marknad. Desse to
# innstillingane er den einaste måten du får vite forskjellen.

# Tal feil på rad før du får éi melding om at verktøyet er nede.
# 5 feil = ca. 100 minutt nede før du blir plaga.
failure_alert_after: 5

# AV, og det kostar ingenting - for morgonmeldinga ER livsteiknet.
#
# Då heile verktøyet var stille som normaltilstand, trongst eit eige
# signal for å skilje "roleg marknad" frå "knekt verktøy". No kjem det
# ei melding kvar einaste handledag uansett. Uteblir ho, veit du med
# ein gong at noko er gale. Ei ekstra melding om fredagen ville berre
# fortalt deg det du alt visste måndag til fredag.
# weekday: 0=måndag ... 4=fredag. hour er lokal tid.
heartbeat_enabled: false
heartbeat_weekday: 4
heartbeat_hour: 17

# Symbola er CNBC-kodar (hovudkjelda). yahoo_fallback er reservekodar
# som blir brukte berre dersom CNBC ikkje svarer.
assets:
  nasdaq:
    label: Nasdaq
    tickers:
      - ".IXIC"   # Nasdaq Composite
      - ".NDX"    # Nasdaq 100
      - "@ND.1"   # Nasdaq 100 futures - handlast også når børsen er stengd
    yahoo_fallback:
      ".IXIC": "^IXIC"
      ".NDX": "^NDX"
      "@ND.1": "NQ=F"

# --- Verdsbilete ---
# Desse er IKKJE varselmål. Du får aldri ei melding om at olja fell,
# at gullet stig eller at DAX ryk. Dei er berre bakgrunn: Claude ser
# dei når han skal avgjere kva som skjer med NASDAQ, og ingenting anna.
#
# Olja ligg her fordi ho driv inflasjonen, inflasjonen driv renta, og
# renta avgjer kva vekstaksjar er verdt. Ho er ein Nasdaq-indikator -
# ikkje eit varselmål.
#
# Alle symbol er testa mot CNBC 25.08.2026.
context_assets:
  asia_i_natt:
    label: Asia i natt
    tickers: [".N225", ".HSI", ".SSEC"]        # Nikkei, Hang Seng, Shanghai
  europa:
    label: Europa
    tickers: [".GDAXI", ".FTSE", ".STOXX50E"]  # DAX, FTSE 100, Euro STOXX 50
  usa_breidde:
    label: USA breidde
    tickers: [".SPX", ".DJI"]                  # S&P 500, Dow
  nasdaq_drivarar:
    label: Nasdaq-drivarar
    # Halvleiarar leier Nasdaq, og renta avgjer kva vekstaksjar er verdt.
    tickers: [".SOX", "NVDA", "US10Y"]
  olje_og_energi:
    label: Olje og energi (bakgrunn)
    # Olja sjølv, energisektoren, gass og dollaren. Stig olja mykje,
    # pressar det inflasjonen opp - og det treffer Nasdaq via renta.
    tickers: ["@CL.1", "@LCO.1", "XLE", "@NG.1", ".DXY"]
  risiko:
    label: Risikovilje
    tickers: [".VIX", "@GC.1"]                 # Frykt-indeksen og gull
  kroner:
    label: Kroner
    tickers: ["NOK=", "EURNOK="]               # USD/NOK, EUR/NOK

# --- Chart og statistikk ---
# Dagleg OHLC-historikk frå api.nasdaq.com. Endepunktet har ikkje
# indeksar, berre ETF-ar og aksjar - og det er like greitt: ein ETF har
# ekte volum, og volum er halve poenget med eit lysestake-mønster.
#
# QQQ følgjer Nasdaq-100 og har ekte omsetnad. Det er det einaste
# instrumentet som blir chartlese - brukaren handlar ikkje anna.
history_assets:
  nasdaq:
    label: QQQ (Nasdaq-100)
    symbol: QQQ
    assetclass: etf

# --- Melding kvar morgon ---
# Oslo Børs opnar 09:00. Denne kjem 20 minutt før, kvar handledag,
# og seier opp, ned eller uklart. Ho er ein EIGEN kanal frå varsla:
# ho senkar ikkje terskelen på dei, ho legg berre til ei fast melding
# du veit kjem. Slik får du noko kvar dag utan at varsla blir slappare.
briefing_enabled: true
briefing_hour: 8
briefing_minute: 40
# Kor breitt vindauge rundt klokkeslettet vi godtek. launchd køyrer
# kvart 20. minutt og treffer ikkje 08:40 på minuttet.
briefing_window_minutes: 25

# --- Faktameldingar ---
# AV. Sondre 01.09: han vil ha tre typar melding og ikkje fleire - opp,
# ned, grå. Eit tal utan retning er ikkje nokon av dei. Han fekk "Core
# CPI kom inn på 0,2 %" og spurde kva han skulle med det, og det er eit
# godt spørsmål: meldinga fortel noko som hende, men ikkje kva han skal
# gjere. Då blir ho støy som gjer dei tre andre mindre verdt.
event_alert_enabled: false       # "Core PCE kom inn på 0,1 % - venta var 0,2 %"
move_alert_enabled: false         # "Det rører seg - Nasdaq ned 1,4 % no"
# Éi melding per nivå. Ein dag som fell jamt skal ikkje gi tjue meldingar.
move_alert_levels: [1.0, 2.0, 3.0]

# --- Varsel når det LENER ein veg, men ikkje er sikkert ---
# Sondre bad om melding med ein gong systemet trur det går opp eller ned,
# ikkje berre når det er sikkert. Det får han - men med talet klistra på.
#
# Basisraten er 56 %. Ein lean på 58 % er altså to prosentpoeng betre enn
# å gjette "opp" kvar einaste dag. Det står i meldinga, kvar gong, fordi
# ein lean som blir lesen som eit sikkert signal er verre enn ingen lean.
# AV, og det skal han vere. Sondre var tydeleg: ingenting under 66 %.
# Eit sjikt som seier "eg ser teikn til" ved 58 % ville vore nettopp
# den mellomtinga han ikkje vil ha.
lean_alert_enabled: false
lean_threshold: 0.55           # under dette er det ikkje eingong ei helling
max_lean_alerts_per_day: 3
lean_cooldown_minutes: 120

# --- Varsel om at det er stort, men uklart ---
# Vanleg tvil er stille. Det er heile prinsippet. Men når marknaden
# rykkjer kraftig, heile verda skriv om det, og signala framleis sprikar,
# så ER uvissa nyheita - og då er stille misvisande.
# Alle fire vilkåra må vere oppfylte, og du får maks eitt i døgnet.
uncertainty_alert_enabled: false
uncertainty_max_confidence: 0.4      # Lunken tvil tel ikkje. Det må vere ekte uvisse.
uncertainty_move_multiplier: 1.8     # Utslaget må vere 1,8x den vanlege terskelen.
uncertainty_min_sources: 4           # Store ting blir dekte av mange aviser.

# Prisrørsle i prosent som i seg sjølv gjer ei sak interessant.
# Gjeld berre Nasdaq - ikkje bakgrunnsbiletet.
price_move_threshold_pct: 0.8

# --- Kor mykje veg kjelda? ---
# Ein Reuters-melding om eit OPEC-vedtak og eit Reddit-innlegg om det
# same er ikkje same sak. Namna nedanfor blir matcha mot kjeldenamnet.
source_tiers:
  # Primærkjelder: dei publiserer sjølve hendinga, ikkje omtale av henne.
  primary:
    - Federal Reserve
    - ECB Press
    - BLS
    - EIA
    - Bank of England
    - Bank of Japan
  # Byrå og aviser med ansvarleg redaktør.
  wire:
    - Reuters
    - Bloomberg
    - AP Top News
    - Financial Times
    - WSJ
    - BBC
    - NYT
    - CNBC
    - MarketWatch
    - Nikkei Asia
    - Guardian
    - Al Jazeera
  # Aggregatorar, bloggar og forum. Kan vere fyrst, kan vere tull.
  loose:
    - ZeroHedge
    - Seeking Alpha
    - Investing
    - Yahoo Finance
    - Hacker News
    # Statsmedia: ofte raskast på hendingar i eige land, men dei er
    # propagandaorgan. Verdifulle som tidleg hint, aldri som einaste kjelde.
    - Tehran Times
    - TASS

# Maks alder på ei sak før ho blir ignorert.
max_news_age_hours: 12

