# Kostnadstabellen. DETTE er fila du oppdaterer, ikkje koden.
#
# Prisane under fell typisk 30-60 % i året, og kven som er billegast
# byttar med nokre månaders mellomrom. Difor ligg dei her og ikkje i
# ein if-setning. Sjekk dei mot leverandøren si prisliste kvar månad.
#
# usd_per_second er DIN innkjøpspris. Alt anna blir rekna ut frå han.
#
# Opplosningar er BOETTER (lav/medium/hd), ikkje tal. Kvar leverandor
# seier kva boetta heiter hos seg, og den strengen gaar rett i API-kallet.
# Utan boetter blir 720p og 768p to ulike ting, og den billegaste
# leverandoren blir stille aldri vald.

valuta:
  # Kva ein dollar kostar deg i kroner. Oppdater ved store hopp.
  nok_per_usd: 10.50

leverandorar:

  minimax_hailuo_fast:
    visingsnamn: "MiniMax Hailuo (fast)"
    usd_per_second: 0.030
    stottar: [bilde_til_video, tekst_til_video]
    maks_sekund: 6
    opplosningar: {lav: 512P, medium: 768P}
    region: cn              # utanfor EOS - sjaa gdpr-notatet i README

  minimax_hailuo_02:
    visingsnamn: "MiniMax Hailuo 02"
    usd_per_second: 0.055
    stottar: [bilde_til_video, tekst_til_video]
    maks_sekund: 10
    opplosningar: {medium: 768P, hd: 1080P}
    region: cn

  seedance_lite:
    visingsnamn: "Seedance 1.0 Lite"
    usd_per_second: 0.025
    stottar: [bilde_til_video, tekst_til_video]
    maks_sekund: 10
    opplosningar: {lav: 480p, medium: 720p}
    region: cn

  wan_serverless:
    visingsnamn: "Wan 2.2 (open weights)"
    usd_per_second: 0.018
    stottar: [bilde_til_video, tekst_til_video]
    maks_sekund: 5
    opplosningar: {lav: 480p, medium: 720p}
    region: eu              # kan sjolvhostast - dette er EOS-utvegen
    aktiv: false            # slaa paa naar du har testa kvaliteten

  runway_turbo:
    visingsnamn: "Runway Gen-4 Turbo"
    usd_per_second: 0.050
    stottar: [bilde_til_video, tekst_til_video]
    maks_sekund: 10
    opplosningar: {medium: 720p, hd: 1080p}
    region: us
    aktiv: false

# Produktnivaa. Kreditprisen er det brukaren betaler.
# Marginen blir rekna ut mot faktisk leverandorkostnad, ikkje gjetta.
nivaa:

  rask:
    visingsnamn: "Rask"
    sekund: 5
    opplosning: lav
    kredittar: 10
    # Billegaste nivaaet skal alltid gaa paa billegaste leverandoer.
    tving_billegast: true

  standard:
    visingsnamn: "Standard"
    sekund: 5
    opplosning: medium
    kredittar: 10

  lang:
    visingsnamn: "Lang"
    sekund: 10
    opplosning: medium
    kredittar: 25

  hd:
    visingsnamn: "HD"
    sekund: 5
    opplosning: hd
    kredittar: 30

okonomi:
  # 1 kreditt = denne prisen i kroner naar brukaren kjoeper for fullpris.
  nok_per_kreditt: 1.00
  # Apple sitt kutt. 0.15 under Small Business Program, 0.30 over 1 mill USD.
  app_store_kutt: 0.15
  # Lagring, CDN, transkoding, moderering per levert video.
  faste_kroner_per_video: 2.00
  # Under denne bruttomarginen skal build-et klage. Sjaa test_pricing.py.
  minste_margin: 0.35

gaver:
  # Ingenting gratis. Avgjort etter aa ha sett gratisbrennet:
  # 1 million registreringar hadde kosta 3,4 millionar kroner foer
  # eit einaste sal. Sjaa README om kva dette kostar i konvertering.
  ved_registrering: 0

abonnement:
  # Kva vi LOVAR i App Store, og kva vi faktisk betaler for.
  #
  # Skilnaden er heile forretninga: du prisar mot lova tal, men
  # betaler for bruka tal. Dei som ikkje brukar opp kvota er marginen.
  #
  # Kvota maa likevel taale ein brukar som brukar HEILE hoe - elles
  # tapar du pengar paa dei ivrigaste kundane dine, som er dei same
  # som anbefaler appen vidare.
  # Kvota er i KREDITTAR, ikkje videoar. Det er heile poenget:
  # ein HD-video kostar tre gonger ein standard, saa ein abonnent kan
  # ikkje veksle kvota si inn i det dyraste og gjere seg sjolv
  # ulonsam. Lovar du "25 videoar" i staden, kan han det.
  pris_nok: 149
  kredittar: 250            # = 25 standardvideoar, eller 8 HD
  venta_bruk: 0.60          # kor stor del av kvota folk faktisk brukar
  minste_margin_verstefall: 0.15

  # AVGJERD: kostar det kredittar aa generere paa nytt?
  #
  # true  - kvota er eit hardt tak paa kva ein abonnent kan koste deg.
  #         Regenererer han mykje, faar han faerre ferdige videoar.
  #         Dette er slik Midjourney og Runway gjer det.
  # false - du betaler for kvar regenerering utan tak. Ein kravstor
  #         brukar kan gaa i minus for deg. Kjennest snillare, men
  #         du maa kutte kvota kraftig for aa taale det.
  #
  # Staar denne til true, er verste tilfellet ein abonnent kan koste
  # deg noeyaktig kvota - uansett kor mykje han masar.
  regenerering_kostar_kredittar: true

verving:
  # Vekst kostar pengar uansett. Spoersmaalet er berre om du betaler
  # Apple for ein annonse eller ein brukar for ei anbefaling.
  #
  # Ein kjoept installasjon kostar 30-80 kr. Ei verving kostar deg
  # kredittane under, altsaa under fem kroner i faktisk GPU-forbruk.
  # Det er den billegaste kanalen du har - men berre om han ikkje kan
  # farmast, difor taka.

  kredittar_til_vervar: 20      # den som delte
  kredittar_til_ny: 20          # den som kom
  maks_vervingar_per_brukar: 25 # taket som gjer farming ulonsamt

  # VIKTIG: naar blir vervinga utbetalt?
  #
  # Betaler du paa klikk, betaler du for bottar. Betaler du foerst naar
  # den nye brukaren faktisk har laga ein video, betaler du for ekte
  # folk. Det er skilnaden mellom ein vekstkanal og eit pengesluk.
  belon_ved: foerste_video
