name: okt

# Éi økt: køyrer verktøyet om att med jamne mellomrom i inntil 5,5 timar.
#
# Dette er ein gjenbrukbar byggjekloss. Grunnen til at han finst: GitHub
# gir kvar JOBB inntil seks timar, men kvar KØYRING inntil 35 dagar. Ei
# køyring med fire slike jobbar etter kvarandre held difor gåande i 22
# timar - frå éi einaste cron-fyring.
#
# Det er heile forskjellen på eit verktøy som er avhengig av at GitHub
# fyrer cron riktig, og eitt som berre treng at han fyrer i det heile.

on:
  workflow_call:
    inputs:
      nr:
        # Kva økt i rekkja dette er. Trengst fordi cache-nøkkelen må vere
        # unik: i ein gjenbrukbar workflow er github.job lik for alle
        # kalla, så utan dette ville berre den fyrste økta få lagra
        # tilstanden sin - og dei tre andre ville mist alt dei gjorde.
        # Det ville mellom anna tydd at ei sendt morgonmelding ikkje blei
        # hugsa, og at ho gjekk ut ein gong til.
        type: number
        default: 1
      timar:
        type: number
        default: 5.5
      mode:
        type: string
        default: auto
      dry_run:
        type: boolean
        default: false

permissions:
  contents: write        # trengst berre for livsteikn-commiten nedanfor

jobs:
  koeyr:
    runs-on: ubuntu-latest
    timeout-minutes: 355          # 5t55m - GitHub kappar ved 6 timar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer avhengigheiter
        run: pip install -r requirements.txt

      # Kvar jobb har sitt eige filsystem, så tilstanden må hentast inn
      # på nytt. Nøkkelen er unik per jobb (ein cache-nøkkel kan berre
      # skrivast éin gong), men restore-keys finn den ferskaste.
      - name: Hent tidlegare tilstand
        uses: actions/cache@v4
        with:
          path: |
            state.json
            cache
          key: mw-state-${{ github.run_id }}-${{ github.run_attempt }}-okt${{ inputs.nr }}
          restore-keys: |
            mw-state-
            market-watch-state-

      - name: Overvak
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFIER: telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          ARGS="--mode ${{ inputs.mode }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          SLUTT=$(( $(date +%s) + $(python -c "print(int(${{ inputs.timar }}*3600))") ))
          RUNDE=0
          while [ "$(date +%s)" -lt "$SLUTT" ]; do
            RUNDE=$((RUNDE+1))
            echo "--- runde $RUNDE  ($(TZ=Europe/Oslo date '+%H:%M norsk')) ---"
            python -m src.main $ARGS
            # Ikkje sov lenger enn det som er att av økta.
            ATT=$(( SLUTT - $(date +%s) ))
            [ "$ATT" -le 0 ] && break
            [ "$ATT" -lt 900 ] && sleep "$ATT" || sleep 900
          done
          echo "Økta ferdig etter $RUNDE rundar."

      # --- Livsteikn til GitHub sjølv ---
      # Dette er ikkje for Sondre sin del. Det er for GitHub sin:
      # i eit offentleg repo blir planlagde workflows slått AV når det
      # ikkje har vore aktivitet på 60 dagar. Er han bortreist i tre
      # månader, ville heile verktøyet stilna utan varsel.
      #
      # Ein liten commit i veka nullstiller den klokka. Commiten blir
      # gjord med GITHUB_TOKEN, som med vilje IKKJE utløyser nye
      # workflows - så han held repoet levande utan å setje noko i gang.
      - name: Hald repoet i live
        if: always()
        run: |
          set -e
          NO=$(date +%s)
          SIST=0
          [ -f .sist-aktiv ] && SIST=$(cat .sist-aktiv 2>/dev/null || echo 0)
          ALDER=$(( (NO - SIST) / 86400 ))

          if [ "$ALDER" -lt 7 ]; then
            echo "Livsteikn er $ALDER dagar gammalt - treng ikkje nytt."
            exit 0
          fi

          echo "$NO" > .sist-aktiv
          git config user.name  "market-watch"
          git config user.email "action@github.com"
          git add .sist-aktiv
          git commit -m "Livsteikn $(date -u +%Y-%m-%d) - held cron i live" || exit 0

          # Andre økter kan ha pusha imedan. Prøv nokre gonger.
          for FORSOEK in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            sleep 5
          done
          echo "Livsteikn sendt."
