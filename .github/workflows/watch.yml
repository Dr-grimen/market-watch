name: market-watch

on:
  schedule:
    # MERK: GitHub Actions køyrer alltid i UTC. Noreg er UTC+1 (vinter) / UTC+2 (sommar).
    # Koden les sjølv av lokal tid og avgjer modus, så drifta over sommartid
    # gjer ingenting - køyringar utanfor aktiv tid avsluttar seg sjølve.

    # MERK OM PÅLITELEGHEIT: GitHub køyrer planlagde jobbar "best effort".
    # Ber du om for mange, blir dei struper eller droppa heilt - vi bad om
    # 45 i døgnet og fekk 2. Difor er dette skore ned til det som trengst,
    # med god luft mellom kvar. Færre og sikrare slår fleire og tapte.

    # Handelsdagen: kvar time. 12-21 UTC = 14-23 norsk tid om sommaren.
    - cron: "0 12-21 * * 1-5"

    # Morgonmeldinga skal ut 08:40 norsk tid = 06:40 UTC om sommaren,
    # 07:40 om vinteren. Fire forsøk dekkjer begge, og koden slepp berre
    # den rette gjennom - state.json hugsar at ho alt er sendt.
    #
    # Blir alle fire droppa, tek etterslep-logikken det: fyrste køyring
    # etter det sender morgonmeldinga likevel, heilt fram til klokka 15,
    # med ærleg tekst om at ho er sein. Det er forskjellen på ei sein
    # melding og inga melding.
    - cron: "20,40 6,7 * * 1-5"

  # Køyr manuelt frå Actions-fana for å teste.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ikkje send melding, berre vis kva som ville blitt sendt"
        type: boolean
        default: true
      mode:
        description: "briefing tvingar fram morgonmeldinga (for testing)"
        type: choice
        options: [auto, briefing, preopen, normal]
        default: auto

concurrency:
  group: market-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer avhengigheiter
        run: pip install -r requirements.txt

      # Hugsar kva som alt er varsla om, så du ikkje får dobbelt opp -
      # og chart-historikken, så vi ikkje hentar 2000 dagsbarar kvar gong.
      - name: Hent tidlegare tilstand
        uses: actions/cache@v4
        with:
          path: |
            state.json
            cache
          key: market-watch-state-${{ github.run_id }}
          restore-keys: |
            market-watch-state-

      - name: Køyr overvakinga
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFIER: ${{ vars.NOTIFIER || 'telegram' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          ALERT_PHONE_NUMBER: ${{ secrets.ALERT_PHONE_NUMBER }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          ARGS="--mode ${MODE:-auto}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m src.main $ARGS
