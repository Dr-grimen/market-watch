name: market-watch

# Overvakar Nasdaq og sender melding på Telegram.
#
# OM PÅLITELEGHEIT - dette er heile grunnen til at fila ser ut som ho gjer:
#
# GitHub køyrer planlagde jobbar "best effort". Dei blir forseinka når
# lasta er høg, og droppa heilt når ho er høg nok. Fyrste utgåva av dette
# bad om 45 fyringar i døgnet og fekk 2. Sondre venta to dagar på ei
# melding som aldri kom.
#
# Løysinga er å slutte å be om mange fyringar, og i staden gjere kvar
# fyring lang. GitHub gir kvar JOBB seks timar, men kvar KØYRING 35
# dagar. Fire jobbar etter kvarandre held difor gåande i 22 timar frå
# éi einaste fyring - og ei køyring som ALT går, blir ikkje droppa.
#
# I tillegg startar "ringen" oss om att når vi er ferdige, så to slike
# køyringar kjeder seg (GitHub tillet tre nivå workflow_run).
#
# Til saman: éi cron-fyring gir over eit døgn med dekning.

on:
  schedule:
    # Skeive minutt med vilje. GitHub sin dokumentasjon seier lasta er
    # høgast ved starten av kvar time, og at køa då kan bli droppa.
    - cron: "37 5 * * 1-5"     # 07:37 norsk - morgonmeldinga 08:40
    - cron: "13 11 * * 1-5"    # 13:13 norsk - amerikansk opning
    - cron: "47 15 * * 1-5"    # 17:47 norsk - ettermiddag

  # Ringen startar oss att når han er ferdig.
  workflow_run:
    workflows: ["ringen"]
    types: [completed]

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ikkje send melding, berre vis kva som ville blitt sendt"
        type: boolean
        default: true
      mode:
        description: "briefing tvingar fram morgonmeldinga"
        type: choice
        options: [auto, briefing, preopen, normal]
        default: auto

concurrency:
  group: market-watch
  cancel-in-progress: false

jobs:
  # Fire økter etter kvarandre. Kvar går 5,5 timar, godt innanfor
  # seks-timarsgrensa per jobb. Til saman 22 timar.
  okt1:
    uses: ./.github/workflows/okt.yml
    secrets: inherit
    with:
      nr: 1
      timar: 5.5
      mode: ${{ github.event.inputs.mode || 'auto' }}
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}

  okt2:
    needs: okt1
    if: always()
    uses: ./.github/workflows/okt.yml
    secrets: inherit
    with:
      nr: 2
      timar: 5.5
      mode: auto
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}

  okt3:
    needs: okt2
    if: always()
    uses: ./.github/workflows/okt.yml
    secrets: inherit
    with:
      nr: 3
      timar: 5.5
      mode: auto
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}

  okt4:
    needs: okt3
    if: always()
    uses: ./.github/workflows/okt.yml
    secrets: inherit
    with:
      nr: 4
      timar: 5.5
      mode: auto
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
